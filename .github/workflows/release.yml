name: release

# Every merge to main is released. The version comes from git tags, not package.json:
#   the next patch (v0.1.2 -> v0.1.3) by default;
#   PR label `release:minor` / `release:major` for a bigger bump, `release:skip` (or
#   "[skip release]" in the commit message) for none.
# The tag is created on the merge commit, the three platforms build into a draft release,
# and the release is published once all of them succeed. A failed build leaves the draft.
# Run it manually from the Actions tab to release main with a chosen bump.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # tags and releases
  pull-requests: read # labels of the merged PR

# One release at a time, in merge order: each run reads the tag the previous one created.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags
      - id: next
        name: Pick the next version, tag and create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main only."
            exit 1
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "This commit is already released ($(git tag --points-at HEAD | tr '\n' ' '))."
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          else
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[0].labels[]?.name] | join(",")' || true)
            case ",$labels," in
              *,release:skip,*) bump=skip ;;
              *,release:major,*) bump=major ;;
              *,release:minor,*) bump=minor ;;
              *) bump=patch ;;
            esac
            case "$MESSAGE" in *"[skip release]"*) bump=skip ;; esac
          fi
          if [ "$bump" = "skip" ]; then
            echo "Not releasing this commit."
            exit 0
          fi

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "${latest:-none} -> v$version ($bump)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Arc Shell v$version"
          git push origin "v$version"
          gh release create "v$version" --draft --verify-tag --title "Arc Shell v$version" --generate-notes \
            --notes "Downloads: Windows \`Arc-Shell-Setup-*-x64.exe\` (or \`-arm64.exe\`), macOS \`Arc-Shell-*-arm64.dmg\` (Apple silicon) or \`-x64.dmg\` (Intel), Linux \`.AppImage\`. Not code-signed: on Windows click More info > Run anyway; on macOS open it once, then System Settings > Privacy & Security > Open Anyway."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest # Apple silicon runner; builds both arm64 and x64 DMGs
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app's version (About, installers, auto-update metadata) is the tag's.
      - run: npm pkg set version="$VERSION"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.platform }} --publish never
        env:
          # No Apple certificate: never pick one up from the keychain; electron-builder.yml
          # sets identity "-" (ad-hoc), which is used regardless of this flag.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Installed Macs only install an update zip whose Ed25519 signature matches the public key
      # in src/main/update-signature.ts (see scripts/sign-update.mts for making the key pair).
      - name: Sign the macOS update zips
        if: runner.os == 'macOS'
        env:
          MAC_UPDATE_SIGNING_KEY: ${{ secrets.MAC_UPDATE_SIGNING_KEY }}
        run: node --experimental-strip-types scripts/sign-update.mts release/*-mac.zip
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.zip.sig release/*.AppImage release/*.blockmap release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers in release/"
            exit 1
          fi
          gh release upload "v$VERSION" "${files[@]}" --clobber

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest
