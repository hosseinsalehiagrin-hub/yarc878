<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="1024" height="1024">
  <!-- YARC app icon, "Captain" (original artwork, GPL-3.0-or-later like the rest of the project):
       a purple A in a tricorn hat, red bandana and eyepatch. The source for Windows, Linux and the
       About screen; scripts/render-icons.mjs puts it on a tile for macOS and renders the PNG/ICO
       files. Below 40px the simpler icon-small.svg is used. -->
  <!-- the A -->
  <path d="M38 140 L80 40 L122 140" fill="none" stroke="#5B12EE" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="54" y1="118" x2="106" y2="118" stroke="#5B12EE" stroke-width="20"/>
  <!-- eyepatch -->
  <path d="M52 74 Q70 94 92 92 L116 89" fill="none" stroke="#1E1B3A" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="94" cy="95" rx="13" ry="11" fill="#1E1B3A"/>
  <!-- bandana knot and tails -->
  <path d="M114 70 Q130 62 142 68 Q130 74 118 76 Z" fill="#EF3B3B"/>
  <path d="M114 73 Q128 84 126 100 Q118 88 110 78 Z" fill="#DC2626"/>
  <circle cx="114" cy="72" r="4.5" fill="#DC2626"/>
  <!-- bandana under the hat -->
  <path d="M48 66 Q80 56 112 66 L112 75 Q80 65 48 75 Z" fill="#EF3B3B"/>
  <!-- tricorn hat with a gold rim -->
  <path d="M28 68 Q38 52 54 50 Q62 22 80 20 Q98 22 106 50 Q122 52 132 68 Q80 50 28 68 Z" fill="#1E1B3A"/>
  <path d="M28 68 Q38 52 54 50 Q62 22 80 20 Q98 22 106 50 Q122 52 132 68" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- skull and crossbones -->
  <line x1="72" y1="45" x2="88" y2="54" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="45" x2="72" y2="54" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="37" r="6.5" fill="#FFFFFF"/>
  <circle cx="77.5" cy="37" r="1.8" fill="#1E1B3A"/>
  <circle cx="82.5" cy="37" r="1.8" fill="#1E1B3A"/>
</svg>
