<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Arc Shell app icon (original artwork, GPL-3.0-or-later like the rest of the project).
       Violet-to-pink rounded square with a white double arch ("shell / horizon").
       The rounded square sits on the macOS icon grid (824px tile, 100px margin). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B21B6"/>
      <stop offset="0.5" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <!-- outer arch -->
  <path d="M 292 622 A 220 220 0 0 1 732 622" fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round"/>
  <!-- inner arch -->
  <path d="M 420 622 A 92 92 0 0 1 604 622" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="72" stroke-linecap="round"/>
</svg>
